# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: HDT6 evals del agente de Parachute S.A. (arquitectura centralizada)

# el prompt es solo el mensaje del usuario: el agente ya trae sus propias
# instrucciones, promptfoo solo le pasa la pregunta
prompts:
  - '{{pregunta}}'

providers:
  - id: file://evals/provider.py
    label: agente_centralizado
    # pausa despues de cada turno del agente, ver la explicacion abajo. va en
    # el provider porque promptfoo ignora evaluateOptions.delay cuando el
    # provider ya trae su propio delay (los providers de python lo traen en 0)
    delay: 45000

defaultTest:
  options:
    # grader de las assertions model graded (factuality, context-faithfulness,
    # llm-rubric). es un modelo mas grande que el del agente (120b contra 20b).
    # se sirve con evals/grader.py en vez de groq: directo, ver ahi el porque
    provider:
      id: file://evals/grader.py
      label: grader_gpt-oss-120b
      config:
        model: openai/gpt-oss-120b
        temperature: 0
        reasoning_effort: low

# groq gratis limita cada modelo a 8000 tokens por minuto, y un turno del
# agente (4 requests entre manager y especialista) gasta de 5000 a 6000 en un
# par de segundos. si se pasa, groq responde 429 y el cliente de openai espera
# y reintenta en silencio, y esa espera se contaba como latencia del agente
# (medido: con 20 s de pausa, desde el septimo caso cada turno tenia de 3 a 5
# rechazos y tardaba 10 a 16 s en vez de 2). por eso: un caso a la vez y 45 s
# de pausa entre turnos (delay del provider, arriba), lo que tarda el cupo en
# recargarse. metadata trae llamadas_llm y reintentos_429 de cada turno para
# comprobarlo en el reporte
evaluateOptions:
  maxConcurrency: 1

tests:
  - file://evals/tests/faqs.yaml
  - file://evals/tests/agenda.yaml
